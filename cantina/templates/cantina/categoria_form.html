<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Categoria - UniFood</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .messages { list-style-type: none; padding: 10px; border-radius: 5px; }
        .messages li.error { color: #721c24; background-color: #f8d7da; padding: 10px; margin-bottom: 5px;}
        .messages li.success { color: #155724; background-color: #d4edda; padding: 10px; margin-bottom: 5px;}
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
    <a href="{% url 'home' %}">⬅️ Voltar para o Início</a>
    <h2>Cadastrar Nova Categoria</h2>

    
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

   
    <form method="post" action="">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}
        </div>
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
