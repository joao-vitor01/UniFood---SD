<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFood - Acesso ao Sistema</title>
    <style>
        :root {
            --brand-orange: #d94e1e;
            --brand-orange-hover: #b83d15;
            --text-main: #333;
            --text-muted: #777;
            --bg-body: #f8f9fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 1px solid #eee;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .brand-header .logo span {
            color: var(--brand-orange);
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: var(--brand-orange);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--brand-orange);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--brand-orange-hover);
        }

        .alert-error {
            background-color: #fdf2f2;
            color: #c53030;
            border: 1px solid #f8d7da;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="logo">
                <span>🍔</span> UniFood
            </div>
            <p>Entre com suas credenciais de acesso</p>
        </div>

        {% if form.errors %}
            <div class="alert-error">
                Usuário ou senha incorretos. Verifique os dados digitados e tente novamente.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" autofocus required id="id_username" placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" required id="id_password" placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-submit">Acessar Painel</button>
        </form>
    </div>

</body>
</html>
